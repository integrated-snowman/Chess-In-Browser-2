<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>♔ Chess Online • Random Matchmaking • GitHub Pages</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/chessboard-js/1.0.0/chessboard-1.0.0.min.css">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chessboard-js/1.0.0/chessboard-1.0.0.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
    <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>

    <style>
        :root { --primary: #4CAF50; --accent: #667eea; --dark: #333; --light: #f9f9fa; }
        body { font-family: 'Segoe UI', Arial, sans-serif; margin:0; padding:20px; min-height:100vh;
               background: linear-gradient(135deg, var(--accent) 0%, #764ba2 100%); color:var(--dark); }
        .container { max-width:1350px; margin:0 auto; background:rgba(255,255,255,0.97); border-radius:20px;
                     padding:30px; box-shadow:0 20px 60px rgba(0,0,0,0.3); }
        h1 { text-align:center; font-size:3.8em; margin:0 0 10px; text-shadow:2px 2px 6px rgba(0,0,0,0.2); }
        h2 { text-align:center; color:#555; margin-bottom:40px; }

        #lobby { text-align:center; }
        .actions { display:flex; justify-content:center; gap:30px; flex-wrap:wrap; margin:50px 0; }
        button.big { padding:18px 50px; font-size:1.5em; border:none; border-radius:50px; cursor:pointer;
                     background:var(--primary); color:white; box-shadow:0 10px 30px rgba(76,175,80,0.5);
                     transition:all .3s; }
        button.big:hover { transform:translateY(-5px); box-shadow:0 18px 40px rgba(76,175,80,0.7); }
        button.big:disabled { background:#999; cursor:not-allowed; transform:none; }

        .private-section { margin:40px auto; max-width:500px; text-align:center; }
        .private-section input { padding:16px; font-size:1.4em; width:220px; border-radius:12px; border:2px solid #ccc; text-align:center; }
        .private-section button { padding:16px 40px; font-size:1.4em; margin-left:15px; }

        #gameArea { display:none; gap:40px; flex-wrap:wrap; }
        #gameArea.show { display:flex; }
        .left { flex:1; min-width:340px; }
        .right { width:380px; }
        #board { width:540px; height:540px; margin:20px auto; border-radius:14px;
                 box-shadow:0 18px 50px rgba(0,0,0,0.4); }
        .players { display:flex; justify-content:center; gap:40px; margin-bottom:25px; }
        .player { padding:22px; background:#f0f0f0; border-radius:18px; text-align:center;
                  min-width:160px; border:5px solid transparent; transition:.3s; }
        .player.active { border-color:var(--primary); transform:scale(1.12); }
        .status { text-align:center; font-size:1.8em; font-weight:bold; padding:20px;
                  background:white; border-radius:14px; margin-bottom:20px; }
        .chat { background:var(--light); border-radius:16px; padding:20px; height:500px;
                display:flex; flex-direction:column; }
        #messages { flex:1; overflow-y:auto; }
        .msg { margin:12px 0; padding:14px 20px; border-radius:22px; max-width:88%; word-wrap:break-word; }
        .msg.me { background:var(--primary); color:white; margin-left:auto; }
        .msg.them { background:#e9ecef; }
        button.small { padding:12px 24px; margin:8px; border:none; border-radius:30px;
                       background:var(--primary); color:white; cursor:pointer; font-size:1.1em; }
        #promotionModal { display:none; position:fixed; inset:0; background:rgba(0,0,0.94);
                          justify-content:center; align-items:center; z-index:1000; }
        .promo-box { background:white; padding:50px; border-radius:30px; text-align:center; }
        .promo-piece { font-size:6.5em; margin:0 30px; cursor:pointer; transition:.2s; }
        .promo-piece:hover { transform:scale(1.3); }

        @media (max-width:1024px) {
            #board { width:92vw; height:92vw; max-width:480px; max-height:480px; }
            #gameArea.show { flex-direction:column; }
            .right { width:100%; }
        }
    </style>
</head>
<body>
<div class="container">
    <div id="lobby">
        <h1>♔ CHESS ♛</h1>
        <h2>Random Matchmaking • Private 6-Digit Games • 100% GitHub Pages</h2>

        <div class="actions">
            <button id="createPublic" class="big">Create Public Game</button>
            <button id="joinRandom" class="big">Join Random Game</button>
            <button id="createPrivate" class="big">Create Private Game</button>
        </div>

        <div class="private-section">
            <input type="text" id="privateCode" placeholder="Enter 6-digit code" maxlength="6">
            <button id="joinPrivate" class="big">Join Private Game</button>
        </div>
    </div>

    <div id="gameArea">
        <div class="left">
            <div class="players">
                <div class="player" id="white"><div contenteditable>White</div><div style="font-size:3.4em">♔</div></div>
                <div class="player" id="black"><div contenteditable>Black</div><div style="font-size:3.4em">♛</div></div>
            </div>
            <div class="status" id="status">Waiting for opponent...</div>
            <div id="board"></div>
            <div style="text-align:center; margin:30px 0;">
                <button class="small" id="newGame">New Game</button>
                <button class="small" id="undoBtn" disabled>Undo Move</button>
                <button class="small" id="flip">Flip Board</button>
            </div>
            <div style="font-family:monospace; background:#f5f5f5; padding:16px; border-radius:14px;" id="moveHistory">No moves yet</div>
        </div>
        <div class="right">
            <div class="chat">
                <div id="messages"></div>
                <input id="chatInput" placeholder="Type a message..." autocomplete="off"
                       style="margin-top:15px; padding:15px; border-radius:30px; border:2px solid #ddd; width:100%; font-size:1.1em;">
            </div>
        </div>
    </div>
</div>

<div id="promotionModal">
    <div class="promo-box">
        <h3>Promote to:</h3>
        <span class="promo-piece" data-p="q">♕</span>
        <span class="promo-piece" data-p="r">♖</span>
        <span class="promo-piece" data-p="b">♗</span>
        <span class="promo-piece" data-p="n">♘</span>
    </div>
</div>

<script>
    // Global variables (add these at the top)
    let peer, conn, myColor, board, game, myName = 'Player';

    // ========== CONFIG – CHANGE THESE TWO LINES ONLY ==========
    const GITHUB_TOKEN = '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'; // ← your token here
    const MATCHMAKER_REPO = 'integrated-snowman/chess-matchmaker/games.json'; // ← your repo
    const MATCHMAKER_RAW = `https://raw.githubusercontent.com/${MATCHMAKER_REPO}/main/games.json`;
    const MATCHMAKER_API = `https://api.github.com/repos/${MATCHMAKER_REPO}/contents/games.json`;
    // ==========================================================

    async function loadWaitingGames() {
        const res = await fetch(MATCHMAKER_RAW + '?t=' + Date.now());
        return await res.json().catch(() => ({}));
    }

    async function saveWaitingGames(data) {
        try {
            const current = await fetch(MATCHMAKER_API).then(r => r.json());
            await fetch(MATCHMAKER_API, {
                method: 'PUT',
                headers: {
                    Authorization: 'token ' + GITHUB_TOKEN,
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    message: 'update waiting games',
                    content: btoa(unescape(encodeURIComponent(JSON.stringify(data, null, 2)))),
                    sha: current.sha,
                    branch: 'main'
                })
            });
        } catch (err) {
            console.error('Failed to save games:', err);
        }
    }

    async function registerMyself(hostId) {  // Renamed for consistency (was registerAsWaiting in one place)
        const games = await loadWaitingGames();
        games[hostId] = Date.now();
        await saveWaitingGames(games);
        localStorage.setItem('myPublicGameId', hostId);
    }

    async function findRandomOpponent() {
        $('#joinRandom').prop('disabled', true).text('Searching...');
        let games = await loadWaitingGames();
        const myId = localStorage.getItem('myPublicGameId');
        const available = Object.keys(games).filter(id => id !== myId);
        if (available.length === 0) {
            alert('No open games right now');
            $('#joinRandom').prop('disabled', false).text('Join Random Game');
            return;
        }
        const chosen = available[Math.floor(Math.random() * available.length)];
        delete games[chosen];
        await saveWaitingGames(games).catch(() => {}); // fire and forget
        joinPublicGame(chosen);
    }

    function joinPublicGame(hostId) {
        peer = new Peer();
        peer.on('open', () => {
            conn = peer.connect(hostId);
            setupConnection(false);
        });
        peer.on('error', err => {
            console.error(err);
            alert('Could not connect — game may have already started');
            $('#joinRandom').prop('disabled', false).text('Join Random Game');
        });
    }

    // Remove yourself when leaving
    window.addEventListener('beforeunload', async () => {
        const myId = localStorage.getItem('myPublicGameId');
        if (myId) {
            const games = await loadWaitingGames();
            delete games[myId];
            localStorage.removeItem('myPublicGameId');
            saveWaitingGames(games).catch(() => {});
        }
    });

    // ================== BUTTONS ==================
    $('#createPublic').click(() => {
        myName = prompt('Your name (optional)', myName) || myName;
        peer = new Peer(); // random ID
        peer.on('open', id => {
            registerMyself(id);  // Fixed: was registerAsWaiting
            setupHost();
            $('#status').text('Waiting for opponent (public game active)');
        });
        peer.on('error', err => console.error('Peer error:', err));
    });

    $('#joinRandom').click(findRandomOpponent);

    $('#createPrivate').click(() => {
        const code = String(Math.floor(100000 + Math.random() * 900000));
        peer = new Peer(code);
        peer.on('open', () => {
            alert(`Private Game Created!\n\nShare this code: ${code}`);
            setupHost();
        });
        peer.on('error', err => {
            if (err.type === 'unavailable-id') {
                alert('Code taken — trying again...');
                $('#createPrivate').click();
            } else {
                console.error(err);
            }
        });
    });

    $('#joinPrivate').click(() => {
        const code = $('#privateCode').val().trim();
        if (!/^\d{6}$/.test(code)) return alert('Enter a valid 6-digit code');
        peer = new Peer();
        peer.on('open', () => {
            conn = peer.connect(code);
            setupConnection(false);
        });
        peer.on('error', () => alert('Invalid code or game no longer exists'));
    });

    // ================== GAME CORE ==================
    function setupHost() {
        peer.on('connection', inc => {
            conn = inc;
            setupConnection(true);
        });
        $('#lobby').hide();
        $('#gameArea').addClass('show');
        $('#status').text('Waiting for opponent...');
    }

    function setupConnection(isHost) {
        conn.on('open', () => {
            $('#lobby').hide();
            $('#gameArea').addClass('show');
            if (isHost) {
                const hostWhite = Math.random() < 0.5;
                myColor = hostWhite ? 'w' : 'b';
                conn.send({ type: 'color', color: hostWhite ? 'b' : 'w' });
            }
            initBoard();
            addMsg('Connected! ' + (myColor ? `You are ${myColor==='w'?'White ♔':'Black ♛'}` : 'Assigning color...'));
        });
        conn.on('data', data => {
            if (data.type === 'color') {
                myColor = data.color;
                initBoard();
                addMsg(`You are ${myColor==='w'?'White ♔':'Black ♛'}`);
            }
            if (data.type === 'move') {
                game.load(data.fen);
                board.position(game.fen());
                updateAll();
            }
            if (data.type === 'chat') addMsg(data.text, false);
            if (data.type === 'reset') { 
                game.reset(); 
                board.start(); 
                updateAll(); 
            }
        });
        conn.on('close', () => {
            alert('Opponent disconnected');
            location.reload();
        });
    }

    let pendingMove;  // For promotion handling
    function initBoard() {
        if (board) board.destroy();
        game = new Chess();  // Initialize chess game
        board = Chessboard('board', {
            draggable: true,
            position: 'start',
            orientation: myColor === 'w' ? 'white' : 'black',
            pieceTheme: 'https://chessboardjs.com/img/chesspieces/wikipedia/{piece}.png',
            onDragStart: (src, piece) => !game.game_over() && game.turn() === myColor && piece.search(myColor === 'w' ? /^b/ : /^w/) === -1,
            onDrop: handleDrop,
            onSnapEnd: () => board.position(game.fen())
        });
        updateAll();
    }

    function handleDrop(src, tgt) {
        pendingMove = {from: src, to: tgt};
        const move = game.move({from: src, to: tgt, promotion: 'q'});
        if (!move) return 'snapback';
        if (move.flags.includes('p')) {
            game.undo();
            $('#promotionModal').show();
            $('.promo-piece').off().one('click', function() {
                const p = $(this).data('p');
                game.move({...pendingMove, promotion: p});
                sendMove();
                $('#promotionModal').hide();
            });
            return;
        }
        sendMove();
    }

    function sendMove() {
        if (conn) conn.send({type: 'move', fen: game.fen()});
        updateAll();
    }

    function updateAll() {
        let txt = game.in_checkmate() ? `Checkmate! ${game.turn()==='w'?'Black':'White'} wins!`
                 : game.in_draw() ? 'Draw!'
                 : (game.turn()==='w'?'White':'Black') + "'s turn" + (game.in_check()?' (check)' : '');
        $('#status').text(txt);
        $('#white').toggleClass('active', game.turn() === 'w');
        $('#black').toggleClass('active', game.turn() === 'b');
        $('#undoBtn').prop('disabled', game.history().length < 2 || game.game_over());
        const h = game.history({verbose:true});
        let hist = '';
        for (let i = 0; i < h.length; i += 2) {
            hist += `${Math.floor(i/2)+1}. ${h[i].san}`;
            if (i+1 < h.length) hist += ` ${h[i+1].san} `;
        }
        $('#moveHistory').text(hist || 'No moves yet');
    }

    function addMsg(text, me = true) {
        const el = $('<div class="msg">').text(text).addClass(me ? 'me' : 'them');
        $('#messages').append(el).scrollTop(1e9);
        if (me && conn) conn.send({type: 'chat', text});
    }

    $('#chatInput').on('keypress', e => {
        if (e.which === 13 && this.value.trim()) {
            addMsg(this.value);
            this.value = '';
        }
    });

    $('#newGame').click(() => confirm('Start a new game?') && (game.reset(), board.start(), conn?.send({type:'reset'}), updateAll()));

    $('#undoBtn').click(() => {
        if (game.history().length >= 2) {
            game.undo(); game.undo();
            board.position(game.fen());
            if (conn) conn.send({type: 'move', fen: game.fen()});
            updateAll();
        }
    });

    $('#flip').click(() => board.flip());
</script>
</body>
</html>
