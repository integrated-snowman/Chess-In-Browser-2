<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>♔ Chess Online • Public Games Listed Live</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/chessboard-js/1.0.0/chessboard-1.0.0.min.css">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chessboard-js/1.0.0/chessboard-1.0.0.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
    <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
    <style>
        :root { --primary: #4CAF50; --accent: #667eea; --dark: #333; --light: #f9f9fa; }
        body { font-family: 'Segoe UI', Arial, sans-serif; margin:0; padding:20px; min-height:100vh;
               background: linear-gradient(135deg, var(--accent) 0%, #764ba2 100%); color:var(--dark); }
        .container { max-width:1350px; margin:0 auto; background:rgba(255,255,255,0.97); border-radius:20px;
                     padding:30px; box-shadow:0 20px 60px rgba(0,0,0,0.3); }
        h1 { text-align:center; font-size:3.8em; margin:0 0 10px; text-shadow:2px 2px 6px rgba(0,0,0,0.2); }
        h2 { text-align:center; color:#555; margin-bottom:40px; }
        #lobby { text-align:center; }
        .actions { display:flex; justify-content:center; gap:30px; flex-wrap:wrap; margin:50px 0; }
        button.big { padding:18px 50px; font-size:1.5em; border:none; border-radius:50px; cursor:pointer;
                     background:var(--primary); color:white; box-shadow:0 10px 30px rgba(76,175,80,0.5);
                     transition:all .3s; }
        button.big:hover { transform:translateY(-5px); box-shadow:0 18px 40px rgba(76,175,80,0.7); }
        .private-section { margin:40px auto; max-width:500px; text-align:center; }
        .private-section input { padding:16px; font-size:1.4em; width:220px; border-radius:12px; border:2px solid #ccc; text-align:center; }
        .private-section button { padding:16px 40px; font-size:1.4em; margin-left:15px; }
        #openRooms { display:grid; gap:22px; grid-template-columns:repeat(auto-fill,minmax(340px,1fr)); margin-top:50px; }
        .room { background:var(--light); padding:28px; border-radius:16px; text-align:center;
                box-shadow:0 6px 20px rgba(0,0,0.12); cursor:pointer; transition:.3s; }
        .room:hover { transform:translateY(-10px); box-shadow:0 18px 40px rgba(0,0,0.25); }
        #gameArea { display:none; gap:40px; flex-wrap:wrap; }
        #gameArea.show { display:flex; }
        .left { flex:1; min-width:340px; }
        .right { width:380px; }
        #board { width:540px; height:540px; margin:20px auto; border-radius:14px;
                 box-shadow:0 18px 50px rgba(0,0,0.0.4); }
        .players { display:flex; justify-content:center; gap:40px; margin-bottom:25px; }
        .player { padding:22px; background:#f0f0f0; border-radius:18px; text-align:center;
                  min-width:160px; border:5px solid transparent; transition:.3s; }
        .player.active { border-color:var(--primary); transform:scale(1.12); }
        .status { text-align:center; font-size:1.8em; font-weight:bold; padding:20px;
                  background:white; border-radius:14px; margin-bottom:20px; }
        .chat { background:var(--light); border-radius:16px; padding:20px; height:500px;
                display:flex; flex-direction:column; }
        #messages { flex:1; overflow-y:auto; }
        .msg { margin:12px 0; padding:14px 20px; border-radius:22px; max-width:88%; word-wrap:break-word; }
        .msg.me { background:var(--primary); color:white; margin-left:auto; }
        .msg.them { background:#e9ecef; }
        button.small { padding:12px 24px; margin:8px; border:none; border-radius:30px;
                       background:var(--primary); color:white; cursor:pointer; font-size:1.1em; }
        #promotionModal { display:none; position:fixed; inset:0; background:rgba(0,0,0.94);
                          justify-content:center; align-items:center; z-index:1000; }
        .promo-box { background:white; padding:50px; border-radius:30px; text-align:center; }
        .promo-piece { font-size:6.5em; margin:0 30px; cursor:pointer; transition:.2s; }
        .promo-piece:hover { transform:scale(1.3); }
        @media (max-width:1024px) {
            #board { width:92vw; height:92vw; max-width:480px; max-height:480px; }
            #gameArea.show { flex-direction:column; }
            .right { width:100%; }
        }
    </style>
</head>
<body>
<div class="container">
    <div id="lobby">
        <h1>♔ CHESS ♛</h1>
        <h2>Public Games Listed Live on This Page • Private 6-Digit • GitHub Pages</h2>
        <div class="actions">
            <button id="createPublic" class="big">Create Public Game</button>
            <button id="createPrivate" class="big">Create Private Game</button>
        </div>
        <div class="private-section">
            <input type="text" id="privateCode" placeholder="Enter 6-digit code" maxlength="6">
            <button id="joinPrivate" class="big">Join Private</button>
        </div>
        <h3 style="margin-top:60px;">Live Public Games (auto-refresh every 10s)</h3>
        <div id="openRooms"><p><i>Loading live games from document...</i></p></div>
    </div>

    <div id="gameArea">
        <div class="left">
            <div class="players">
                <div class="player" id="white"><div contenteditable>White</div><div style="font-size:3.4em">♔</div></div>
                <div class="player" id="black"><div contenteditable>Black</div><div style="font-size:3.4em">♛</div></div>
            </div>
            <div class="status" id="status">Waiting for opponent...</div>
            <div id="board"></div>
            <div style="text-align:center; margin:30px 0;">
                <button class="small" id="newGame">New Game</button>
                <button class="small" id="undoBtn" disabled>Undo</button>
                <button class="small" id="flip">Flip Board</button>
            </div>
            <div style="font-family:monospace; background:#f5f5f5; padding:16px; border-radius:14px;" id="moveHistory">No moves yet</div>
        </div>
        <div class="right">
            <div class="chat">
                <div id="messages"></div>
                <input id="chatInput" placeholder="Type a message..." autocomplete="off">
            </div>
        </div>
    </div>
</div>

<div id="promotionModal">
    <div class="promo-box">
        <h3>Promote to:</h3>
        <span class="promo-piece" data-p="q">♕</span>
        <span class="promo-piece" data-p="r">♖</span>
        <span class="promo-piece" data-p="b">♗</span>
        <span class="promo-piece" data-p="n">♘</span>
    </div>
</div>

<!-- LIVE LOBBY DATA EMBEDDED IN DOCUMENT -->
<script id="lobby-data" type="application/json">
{"ts":1732224000000,"games":{}}
</script>

<script>
    // Auto-refresh page every 10 seconds so everyone sees updated list
    setTimeout(() => location.reload(), 10000);

    let lobbyScript = document.getElementById('lobby-data');
    let data = JSON.parse(lobbyScript.textContent);
    let myRoomId = null;

    function saveLobby() {
        lobbyScript.textContent = JSON.stringify(data);
        // Force page to reload for others in ~10s
        data.ts = Date.now();
    }

    function refreshLobby() {
        const now = Date.now();
        let changed = false;
        for (let id in data.games) {
            if (now - data.games[id].created > 8*60*1000) {
                delete data.games[id];
                changed = true;
            }
        }
        if (changed) saveLobby();

        const list = $('#openRooms');
        list.empty();
        const games = Object.entries(data.games)
            .filter(([,g]) => now - g.created < 8*60*1000)
            .sort((a,b) => b[1].created - a[1].created);

        if (games.length === 0) {
            list.html('<p><i>No public games right now — create one!</i></p>');
        } else {
            games.forEach(([id, g]) => {
                const mins = Math.round((now - g.created)/60000);
                const card = $(`
                    <div class="room" data-id="${id}">
                        <h3>${g.name}'s Game</h3>
                        <small>${mins==0?'Just now':mins+' min ago'}</small>
                    </div>
                `);
                card.click(() => joinPublic(id));
                list.append(card);
            });
        }
    }

    function addGame(id, name) {
        data.games[id] = { name, created: Date.now() };
        saveLobby();
        myRoomId = id;
    }

    function removeGame(id) {
        delete data.games[id];
        saveLobby();
    }

    // Buttons
    $('#createPublic').click(() => {
        const name = prompt('Your name (optional)') || 'Player';
        peer = new Peer();
        peer.on('open', id => {
            addGame(id, name);
            setupHost();
        });
    });

    function joinPublic(id) {
        removeGame(id);  // instantly remove so no one else joins
        peer = new Peer();
        peer.on('open', () => {
            conn = peer.connect(id);
            setupConnection(false);
        });
    }

    // Rest of your original PeerJS + chess code (unchanged below)
    let board, game = new Chess(), peer, conn, myColor, pendingMove;

    function setupHost() {
        peer.on('connection', inc => {
            conn = inc;
            if (myRoomId) removeGame(myRoomId);
            setupConnection(true);
        });
        $('#lobby').hide();
        $('#gameArea').addClass('show');
        $('#status').text('Waiting for opponent...');
    }

    function setupConnection(isHost) {
        conn.on('open', () => {
            $('#lobby').hide();
            $('#gameArea').addClass('show');
            if (isHost) {
                const hostWhite = Math.random() < 0.5;
                myColor = hostWhite ? 'w' : 'b';
                conn.send({ type: 'color', color: hostWhite ? 'b' : 'w' });
            }
            initBoard();
            addMsg('Connected!');
        });
        conn.on('data', data => {
            if (data.type === 'color') { myColor = data.color; initBoard(); }
            if (data.type === 'move') { game.load(data.fen); board.position(game.fen()); updateAll(); }
            if (data.type === 'chat') addMsg(data.text, false);
            if (data.type === 'reset') { game.reset(); board.start(); updateAll(); }
        });
        conn.on('close', () => { alert('Opponent left'); location.reload(); });
    }

    function initBoard() {
        if (board) board.destroy();
        board = Chessboard('board', {
            draggable: true,
            position: 'start',
            orientation: myColor === 'w' ? 'white' : 'black',
            pieceTheme: 'https://chessboardjs.com/img/chesspieces/wikipedia/{piece}.png',
            onDragStart: (s, p) => !game.game_over() && game.turn() === myColor && !p.search(myColor === 'w' ? /^b/ : /^w/),
            onDrop: handleDrop,
            onSnapEnd: () => board.position(game.fen())
        });
        updateAll();
    }

    function handleDrop(src, tgt) {
        pendingMove = {from: src, to: tgt};
        let move = game.move({from: src, to: tgt, promotion: 'q'});
        if (!move) return 'snapback';
        if (move.flags.includes('p')) {
            game.undo();
            $('#promotionModal').show();
            $('.promo-piece').off().one('click', function() {
                game.move({...pendingMove, promotion: $(this).data('p')});
                sendMove();
                $('#promotionModal').hide();
            });
            return;
        }
        sendMove();
    }

    function sendMove() { conn?.send({type: 'move', fen: game.fen()}); updateAll(); }

    function updateAll() {
        const txt = game.in_checkmate() ? `Checkmate! ${game.turn()==='w'?'Black':'White'} wins!`
                 : game.in_draw() ? 'Draw!'
                 : (game.turn()==='w'?'White':'Black') + "'s turn" + (game.in_check()?' (check)' : '');
        $('#status').text(txt);
        $('#white').toggleClass('active', game.turn() === 'w');
        $('#black').toggleClass('active', game.turn() === 'b');
        $('#undoBtn').prop('disabled', game.history().length < 2 || game.game_over());
        const h = game.history();
        let hist = ''; for (let i=0; i<h.length; i+=2) hist += `${Math.floor(i/2)+1}. ${h[i]} ${i+1<h.length?h[i+1]:''} `;
        $('#moveHistory').text(hist || 'No moves yet');
    }

    function addMsg(text, me=true) {
        const el = $('<div class="msg">').text(text).addClass(me?'me':'them');
        $('#messages').append(el).scrollTop(1e9);
        if (me && conn) conn.send({type:'chat', text});
    }

    $('#chatInput').keypress(e => { if(e.which===13 && this.value.trim()){ addMsg(this.value); this.value=''; }});
    $('#newGame').click(() => confirm('New game?') && (game.reset(), board.start(), conn?.send({type:'reset'}), updateAll()));
    $('#undoBtn').click(() => { if(game.history().length>=2){ game.undo(); game.undo(); board.position(game.fen()); conn?.send({type:'move', fen:game.fen()}); updateAll(); }});
    $('#flip').click(() => board.flip());

    // Private games (unchanged)
    $('#createPrivate').click(() => {
        const code = String(Math.floor(100000 + Math.random()*900000));
        peer = new Peer(code);
        peer.on('open', () => alert(`Private code: ${code}`));
        peer.on('connection', inc => { conn=inc; setupConnection(true); });
        $('#lobby').hide(); $('#gameArea').addClass('show');
    });
    $('#joinPrivate').click(() => {
        const code = $('#privateCode').val().trim();
        if(/^\d{6}$/.test(code)) {
            peer = new Peer();
            peer.on('open', () => { conn = peer.connect(code); setupConnection(false); });
        } else alert('6 digits!');
    });

    refreshLobby();
    setInterval(refreshLobby, 9000);
</script>
</body>
</html>
